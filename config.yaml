# Base URL of the J3 app (from the HAR).
base_url: "https://seaspan-j3.jibe.solutions"

# --- AUTH -------------------------------------------------------------------
# The HAR does not contain a login request (capture started mid-session), so
# this tool cannot obtain a session token on its own. Log into the J3 web
# app, open DevTools -> Network, copy the `session` query-string value from
# any /api/* call, and paste it below. Tokens observed in the HAR are valid
# for 48 hours from issue; the importer will detect an expired/invalid token
# (HTTP 401/403) and stop with a clear message rather than silently failing.
session_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJkYXRhIjoiZ2hVQ3pOU3RSZlhYUE9WbGF1Uy92bFYvMFlLOTBFVXZ3bEY3ZTZzV0p3YVZNbGJBd1QwVnZVM3J5Y1dFTHU3U3MrK3ZiNjRZUmM2bnhIYlc2V1cxbHhVZW83TjZjZlI0aVpiUEttZ2hwbm1TWFp0R3Y3SXFDTU42OHJoMVpUd2t4ck0zY00wZnJLeFVreVA0RXp5Z1BzMnNNRENmMjVpRzJCdFhuTytOMWU0PSIsImlhdCI6MTc4NDY4OTIwMCwiZXhwIjoxNzg0ODYyMDAwfQ.mQyY4B2ZoYTaH1ihGfommelpq2VaiUf4che6H_2Thq4"

# --- LOOKUP TABLES ------------------------------------------------------
# The HAR confirms the `criticality` lookup uses this exact table name.
# `unit_of_measurement` and `material` follow the same j3_pms_lib_* naming
# convention seen elsewhere in the HAR, but no request in the capture ever
# calls them, so these two names are NOT confirmed against a real request.
# If the importer's startup lookup call 404s / returns empty, open the J3 UI,
# watch the Network tab while opening the "Unit of Measurement" or "Material"
# dropdown on the Add Spare form, and correct the table name here.
lookup_tables:
  criticality: "j3_pms_lib_criticality"          # confirmed in HAR
  unit_of_measurement: "j3_pms_lib_unit_of_measurement"  # UNCONFIRMED - verify
  material: "j3_pms_lib_material"                # UNCONFIRMED - verify

# --- EXECUTION ---------------------------------------------------------
delay_between_requests_seconds: 15   # per Phase 5 spec — pause between rows
max_retries: 3
retry_backoff_seconds: 5
request_timeout_seconds: 30

# --- FILES ---------------------------------------------------------------
csv_input: "spares_import_template.csv"
output_dir: "output"
